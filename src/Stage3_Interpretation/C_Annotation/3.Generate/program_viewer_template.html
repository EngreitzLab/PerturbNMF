<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__ — program annotations</title>
<!-- Layout and palette follow the single-file annotation viewer; filled by program_viewer.py. -->
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-soft: #f0efec; --border: #e3e2de;
  --text: #0b0b0b; --text-soft: #52514e; --muted: #7a7974;
  --accent: #0d9488; --accent-soft: #d5f0ec; --accent-text: #0b5e57;
  --bar: #2a78d6; --div-neg: #1c5cab; --div-pos: #c43d3d; --div-mid: #f0efec;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-soft: #242422; --border: #33332f;
  --text: #ffffff; --text-soft: #c3c2b7; --muted: #8f8e86;
  --accent: #2dd4bf; --accent-soft: #123b37; --accent-text: #7ee8da;
  --bar: #3987e5; --div-neg: #3987e5; --div-pos: #e66767; --div-mid: #383835;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
a { color: var(--accent-text); }
.top { position: sticky; top: 0; z-index: 10; height: 53px; display: flex; align-items: center; gap: 14px;
  padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.top input { flex: 1; max-width: 420px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-soft); color: var(--text); font: inherit; }
.top .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.top button { border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
  border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.top button:hover { background: var(--surface-soft); }
.spacer { flex: 1; }
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); }
.rail { position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px); overflow-y: auto;
  border-right: 1px solid var(--border); padding: 14px 10px 32px 14px; background: var(--surface); }
.rail h4 { margin: 16px 8px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rail h4:first-child { margin-top: 4px; }
.rail a { display: flex; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--text-soft);
  font-size: 12.5px; cursor: pointer; text-decoration: none; line-height: 1.35; }
.rail a .num { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 26px; }
.rail a .tag { margin-left: auto; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.rail a:hover { background: var(--surface-soft); }
.rail a.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 650; }
.canvas { padding: 26px clamp(18px, 3vw, 40px) 80px; }
.wrap { max-width: 1180px; margin: 0 auto; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text); }
h1 { font-size: 27px; line-height: 1.2; margin: 10px 0 4px; }
.sub { color: var(--text-soft); margin: 0 0 12px; font-size: 13.5px; }
.lead { font-size: 15px; margin: 8px 0 18px; max-width: 900px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 14px 0; }
.card > h3, details > summary { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
details.card > summary { cursor: pointer; margin: 0; list-style: none; }
details.card { overflow-x: auto; }
details.card > summary::before { content: "▸ "; color: var(--muted); }
details.card[open] > summary::before { content: "▾ "; }
details.card[open] > summary { margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 1px 7px; margin: 2px 3px 2px 0;
  border-radius: 6px; background: var(--surface-soft); border: 1px solid var(--border); }
.chip.hit { border-color: var(--accent); color: var(--accent-text); font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.status { white-space: nowrap; font-weight: 600; }
.status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.slot h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.slot p { margin: 0 0 6px; }
.act { display: flex; align-items: flex-end; gap: 2px; height: 96px; margin-top: 6px; }
.act .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: default; }
.act .b { width: 70%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 1px; }
.act .v { font-size: 11px; color: var(--text-soft); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.axis { display: flex; gap: 2px; border-top: 1px solid var(--muted); }
.axis div { flex: 1; text-align: center; font-size: 11px; color: var(--text-soft); padding-top: 3px; line-height: 1.25; }
.axis .pk { font-weight: 700; color: var(--text); }
.heat { border-collapse: separate; border-spacing: 2px; width: auto; }
.heat td, .heat th { border: 0; padding: 0; }
.heat th { font-size: 11px; text-align: center; padding: 0 2px 3px; text-transform: none; letter-spacing: 0; }
.heat td.g { font-family: var(--mono); font-size: 12px; padding-right: 8px; white-space: nowrap; }
.heat th.rg { vertical-align: bottom; padding: 0 0 4px; }
.heat th.rg span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
.heat td.c { width: 62px; height: 22px; border-radius: 4px; text-align: center; font-size: 11px;
  font-variant-numeric: tabular-nums; color: var(--text); }
.heat td.c.sig { font-weight: 700; box-shadow: inset 0 0 0 2px var(--text); }
.heat td.c.na { background: transparent; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-soft); margin: 4px 0 10px; }
.legend .sw { display: inline-block; width: 14px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--text); color: var(--surface);
  font-size: 12px; padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .08s; max-width: 320px; }
.qc { border-left: 3px solid var(--warning); }
.qc.clean { border-left-color: var(--good); }
.flag { font-size: 12px; font-weight: 600; }
button.link { background: none; border: 0; color: var(--accent-text); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
@media (max-width: 880px) { .shell { grid-template-columns: 1fr; } .rail { display: none; } }
a.chip { color: var(--text); text-decoration: none; }
a.chip.hit { color: var(--accent-text); }
a.chip:hover { border-color: var(--muted); }
ul.papers { margin: 0 0 6px; padding-left: 18px; }
ul.papers li { margin-bottom: 6px; }
.psub { margin: 8px 0 4px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
details.more > summary { cursor: pointer; font-size: 12.5px; color: var(--text-soft); margin: 6px 0; }
ol.go { margin: 4px 0 0; padding-left: 22px; }
.motif-table { margin: 4px 0 8px; }
.motif-table td { vertical-align: middle; padding: 2px 8px; }
.motif-table td.num { white-space: nowrap; }
svg.logo { display: block; background: #fff; border-radius: 3px; }
</style>
</head>
<body>
<div class="top">
  <div class="brand" id="brand"></div>
  <input id="search" type="search" placeholder="Search labels, summaries, genes, regulators, GO terms…" oninput="filterRail()">
  <div class="spacer"></div>
  <div class="meta" id="meta"></div>
  <button onclick="prev()" title="Previous (←)">←</button>
  <button onclick="next()" title="Next (→)">→</button>
  <button onclick="toggleTheme()" id="themeBtn">Dark</button>
</div>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="canvas"><div class="wrap" id="main"></div></main>
</div>
<div class="tip" id="tip"></div>
<script>
const PROGRAMS = __PROGRAMS_JSON__;
const META = __META_JSON__;
// ---- data ---------------------------------------------------------------------------------
const DAYS = META.conditions;
const IDS = Object.keys(PROGRAMS).map(Number).sort((a,b)=>a-b);
let currentId = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("brand").textContent = META.title;
// adj p like Python's "{:.2g}": two significant digits, exponent form below 1e-4
function fmtP(q) {
  if (q == null) return "";
  q = Number(q);
  if (q === 0 || Math.abs(q) >= 1e-4) return String(Number(q.toPrecision(2)));
  const [m, e] = q.toExponential(1).split("e");
  return m.replace(/\.0$/, "") + "e" + e[0] + e.slice(1).padStart(2, "0");
}
const signed = (v, d=2) => v == null ? "" : (v > 0 ? "+" : "") + Number(v).toFixed(d);

function motifNames(p) {
  if (!p.motifs) return "";
  return Object.values(p.motifs.families).flat().flatMap(f => [f.family, ...f.motifs.map(m => m[0]),
    ...f.candidates.map(c => c.tf)]).join(" ");
}
const SEARCH_INDEX = {};
for (const id of IDS) {
  const p = PROGRAMS[id], d = p.drivers || {driving: []};
  SEARCH_INDEX[id] = [p.label, p.sentence, p.group, p.top_genes.join(" "), p.distinctive.join(" "),
    p.regulators.map(r => r.gene).join(" "), p.grid.map(g => g.gene).join(" "), p.go.join(" "),
    d.driving.map(g => g.gene).join(" "), motifNames(p),
    p.interpretation ? p.interpretation.modules.map(m => m.name + " " + m.genes.join(" ")).join(" ") : "",
    "P"+id, "program "+id].join(" ").toLowerCase();
}

// ---- rail ---------------------------------------------------------------------------------
function buildRail() {
  let out = "";
  for (const g of META.groups) {
    const ids = IDS.filter(id => PROGRAMS[id].group === g);
    if (!ids.length) continue;
    out += `<h4>${esc(g)} (${ids.length})</h4>`;
    out += ids.map(id => { const p = PROGRAMS[id];
      return `<a data-id="${id}" href="#program-${id}" onclick="render(${id});return false;">` +
             `<span class="num">P${id}</span><span>${esc(p.label)}</span>${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}</a>`; }).join("");
  }
  document.getElementById("rail").innerHTML = out;
  filterRail();
}
function filterRail() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  let shown = 0;
  document.querySelectorAll(".rail a").forEach(a => {
    const ok = !q || SEARCH_INDEX[a.dataset.id].includes(q); a.style.display = ok ? "" : "none"; if (ok) shown++; });
  document.querySelectorAll(".rail h4").forEach(h => {
    let el = h.nextElementSibling, any = false;
    while (el && el.tagName === "A") { if (el.style.display !== "none") any = true; el = el.nextElementSibling; }
    h.style.display = any ? "" : "none"; });
  document.getElementById("meta").textContent = q ? `${shown} of ${IDS.length} programs` : `${IDS.length} programs · ${META.built}`;
}

// ---- genes --------------------------------------------------------------------------------
// gene chip linked to NCBI Gene: the gene's page when its Entrez id is known, else a symbol search
function geneHref(p, g) {
  const c = p.genes[g] || {};
  return c.entrez ? `https://www.ncbi.nlm.nih.gov/gene/${c.entrez}`
    : `https://www.ncbi.nlm.nih.gov/gene/?term=${encodeURIComponent(g)}%5Bsym%5D+AND+${encodeURIComponent(META.organism)}%5Borgn%5D`;
}
function chip(p, g, hit) {
  const name = (p.genes[g] || {}).name;
  return `<a class="chip${hit ? " hit" : ""}" href="${esc(geneHref(p, g))}" target="_blank" rel="noopener"${name ? ` data-tip="${esc(g + ": " + name)}"` : ""}>${esc(g)}</a>`;
}
const chips = (p, arr, hits) => (arr || []).length ? arr.map(g => chip(p, g, hits && hits.has(g))).join("") : `<span class="muted small">None.</span>`;

// ---- activity -----------------------------------------------------------------------------
function activityCard(p) {
  const conds = Object.keys(p.activity || {});
  if (!conds.length) return "";
  if (conds.length === 1) {
    const a = p.activity[conds[0]];
    return `<p class="sub">${esc(conds[0])}: expressed in ${a.pct_cells_expressed}% of cells · mean usage ${a.mean_usage}</p>`;
  }
  const max = Math.max(...conds.map(c => p.activity[c].mean_usage)) || 1;
  const peak = conds.reduce((a, c) => p.activity[c].mean_usage > p.activity[a].mean_usage ? c : a, conds[0]);
  const cols = conds.map(c => { const a = p.activity[c], h = Math.max(1, Math.round(100 * a.mean_usage / max));
    return `<div class="col" data-tip="${esc(`${c}: mean usage ${a.mean_usage}, expressed in ${a.pct_cells_expressed}% of cells`)}"><div class="v">${a.pct_cells_expressed}%</div><div class="b" style="height:${h}%"></div></div>`; }).join("");
  const axis = conds.map(c => `<div class="${c === peak ? "pk" : ""}">${esc(c)}</div>`).join("");
  return `<div class="card"><h3>Program activity by condition</h3><div class="act">${cols}</div><div class="axis">${axis}</div>
    <p class="small muted" style="margin:8px 0 0">Mean program usage per condition (% of cells expressing the program above each bar). Peak: <b>${esc(peak)}</b>.</p></div>`;
}

// ---- colours ------------------------------------------------------------------------------
function mix(a, b, t) {
  const pa = a.match(/\w\w/g).map(h=>parseInt(h,16)), pb = b.match(/\w\w/g).map(h=>parseInt(h,16));
  return "rgb(" + pa.map((x,i)=>Math.round(x+(pb[i]-x)*t)).join(",") + ")";
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function divColor(v, scale) {
  const t = Math.min(1, Math.abs(v) / scale);
  return mix(cssVar("--div-mid"), cssVar(v < 0 ? "--div-neg" : "--div-pos"), 0.15 + 0.85 * t);
}
function inkFor(v, scale) { return Math.abs(v) / scale > 0.55 ? "#ffffff" : "var(--text)"; }

// ---- regulators ---------------------------------------------------------------------------
let gridShowAll = false;
function regulatorGrid(p) {
  if (!p.grid.length) return `<p class="muted">No knockdown reached adj p &lt; ${META.p_value}.</p>`;
  const rows = gridShowAll ? p.grid : p.grid.slice(0, 30);
  const scale = Math.max(1, ...p.grid.flatMap(g => g.cells.filter(c=>c).map(c => Math.abs(c[0]))));
  const capped = Math.min(scale, 3);
  // horizontal: one column per regulator, one row per condition
  const head = `<tr><th></th>${rows.map(g => `<th class="rg"><span>${esc(g.gene)}</span></th>`).join("")}</tr>`;
  const body = DAYS.map((d, i) => `<tr><td class="g">${DAYS.length > 1 ? esc(d) : "log2FC"} <span class="muted">· ${p.grid.filter(g => g.cells[i] && g.cells[i][1]).length} sig</span></td>` + rows.map(g => {
      const c = g.cells[i];
      if (!c) return `<td class="c na">n/a</td>`;
      const [v, sig, q] = c;
      const role = v < 0 ? "activator (knockdown lowers program)" : "repressor (knockdown raises program)";
      const tip = `${g.gene} · ${d}: log2FC ${signed(v)}, adj p ${fmtP(q)}${sig ? " — significant, " + role : " — not significant"}`;
      return `<td class="c${sig?" sig":""}" style="background:${divColor(v, capped)};color:${inkFor(v, capped)}" data-tip="${esc(tip)}">${signed(v)}${sig?"*":""}</td>`;
    }).join("") + `</tr>`).join("");
  const more = p.grid.length > 30
    ? `<p class="small"><button class="link" onclick="gridShowAll=!gridShowAll;render(currentId,true)">${gridShowAll ? "Show top 30" : `Show all ${p.grid.length} regulators`}</button></p>` : "";
  return `<div class="legend"><span><span class="sw" style="background:var(--div-neg)"></span>negative log2FC = knockdown lowers program (activator)</span>
      <span><span class="sw" style="background:var(--div-pos)"></span>positive = knockdown raises program (repressor)</span>
      <span><b>bold, outlined, *</b> = significant (adj p &lt; ${META.p_value})</span></div>
    <div style="overflow-x:auto"><table class="heat">${head}${body}</table></div>${more}
    <p class="small muted">${DAYS.length > 1 ? "log2FC of regulators significant (adj p &lt; " + META.p_value + ") in any condition, ordered left to right by number of significant conditions then best adjusted p." : "Every significant regulator, ordered left to right by adjusted p."} Colour saturates at |log2FC| = ${capped.toFixed(1)}.</p>`;
}

const MAX_LABELS_PER_PANEL = 8;
function volcanoes(p) {
  if (!p.volcano.length || !p.volcano.some(v => v.x.length)) return `<p class="muted">No regulator results.</p>`;
  const names = META.regulator_names, keys = new Set(p.regulators.map(r => r.gene));
  const multi = p.volcano.length > 1;
  const W = multi ? 250 : 560, H = multi ? 250 : 320, m = {l: 40, r: 10, t: 34, b: 30};
  // Robust x range: a handful of extreme non-significant knockdowns would otherwise squash the
  // plot. Significant points always fit; anything beyond the range is clamped to the edge.
  const absx = p.volcano.flatMap(v => v.x.map(a => Math.abs(a) / 100)).sort((a, b) => a - b);
  const q995 = absx[Math.floor(0.995 * (absx.length - 1))] || 1;
  const sigmax = Math.max(0, ...p.volcano.flatMap(v => v.x.filter((_, j) => v.s[j]).map(a => Math.abs(a) / 100)));
  const xmax = Math.min(8, Math.max(1, q995, 1.1 * sigmax));
  const ymax = Math.max(1.5, ...p.volcano.flatMap(v => v.y.map(a => a / 100)));
  const sx = x => m.l + (Math.max(-xmax, Math.min(xmax, x)) + xmax) / (2 * xmax) * (W - m.l - m.r);
  const sy = y => H - m.b - y / ymax * (H - m.t - m.b);
  const thr = -Math.log10(META.p_value);
  const panels = p.volcano.map((v, i) => {
    let dots = "", labels = [];
    const order = v.x.map((_, j) => j).sort((a, b) => v.s[a] - v.s[b]);  // significant drawn last, on top
    for (const j of order) {
      const x = v.x[j] / 100, y = v.y[j] / 100, gene = names[v.g[j]], sig = v.s[j];
      const fill = sig ? (x < 0 ? "var(--div-neg)" : "var(--div-pos)") : "var(--muted)";
      const r = sig ? 3.2 : 1.8, op = sig ? 0.95 : 0.35;
      const tip = `${gene} · ${v.condition}: log2FC ${signed(x)}, adj p ${Math.pow(10, -y).toExponential(1)}${sig ? (x < 0 ? " — activator" : " — repressor") : " — n.s."}`;
      dots += `<circle cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="${r}" fill="${fill}" fill-opacity="${op}" stroke="var(--surface)" stroke-width="${sig ? 1 : 0}" data-tip="${esc(tip)}"/>`;
      if (sig) labels.push({gene, x, y, key: keys.has(gene)});
    }
    // Label the top regulators given to the annotator first, then the most significant others.
    labels.sort((a, b) => (b.key - a.key) || (b.y - a.y));
    const placed = [];
    let text = "";
    for (const l of labels.slice(0, MAX_LABELS_PER_PANEL)) {
      let lx = sx(l.x) + (l.x < 0 ? -5 : 5), ly = sy(l.y) - 4;
      while (placed.some(q => Math.abs(q.y - ly) < 11 && Math.abs(q.x - lx) < 48)) ly += 11;
      placed.push({x: lx, y: ly});
      text += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10.5" text-anchor="${l.x < 0 ? "end" : "start"}" fill="var(--text)" font-weight="${l.key ? 700 : 400}" font-family="var(--mono)">${esc(l.gene)}</text>`;
    }
    const ticks = [-Math.floor(xmax), 0, Math.floor(xmax)].filter((t, k, a) => a.indexOf(t) === k);
    const yticks = [0, Math.round(ymax / 2), Math.floor(ymax)].filter((t, k, a) => a.indexOf(t) === k);
    const axis = `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--border)"/>
      <line x1="${sx(0)}" x2="${sx(0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--border)"/>
      <line x1="${m.l}" x2="${W - m.r}" y1="${sy(thr)}" y2="${sy(thr)}" stroke="var(--muted)" stroke-dasharray="3,3"/>
      <text x="${W - m.r}" y="${sy(thr) - 3}" font-size="9.5" text-anchor="end" fill="var(--muted)">adj p = ${META.p_value}</text>
      ${ticks.map(t => `<text x="${sx(t)}" y="${H - m.b + 12}" font-size="10" text-anchor="middle" fill="var(--text-soft)">${t}</text>`).join("")}
      ${yticks.map(t => `<text x="${m.l - 4}" y="${sy(t) + 3}" font-size="10" text-anchor="end" fill="var(--text-soft)">${t}</text>`).join("")}
      <text x="${(m.l + W - m.r) / 2}" y="${H - 4}" font-size="10" text-anchor="middle" fill="var(--text-soft)">log2FC (knockdown effect)</text>
      <text x="12" y="${(m.t + H - m.b) / 2}" font-size="10" text-anchor="middle" fill="var(--text-soft)" transform="rotate(-90 10 ${(m.t + H - m.b) / 2})">−log10 adj p</text>
      <text x="${m.l}" y="13" font-size="11.5" font-weight="700" fill="var(--text)">${esc(v.condition)}</text>
      <text x="${W - m.r}" y="13" font-size="10.5" text-anchor="end" fill="var(--text-soft)">${p.n_sig_by_condition[i]} of ${v.x.length} significant</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Volcano plot ${esc(v.condition)}" style="max-width:100%">${axis}${dots}${text}</svg>`;
  }).join("");
  return `<div class="legend"><span><span class="sw" style="background:var(--div-neg)"></span>activator — knockdown lowers the program</span>
      <span><span class="sw" style="background:var(--div-pos)"></span>repressor — knockdown raises it</span>
      <span><span class="sw" style="background:var(--muted);opacity:.5"></span>not significant</span>
      <span><b>bold label</b> = top regulator given to the annotator</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px">${panels}</div>
    <p class="small muted">Program log2FC on knockdown per perturbed gene${multi ? ", one panel per condition, same axes" : ""}; coloured = adj p ≤ ${META.p_value} and log2FC ≥ ${META.up} or ≤ ${META.down}. Up to ${MAX_LABELS_PER_PANEL} significant regulators labelled per panel. Hover a point for its values.</p>`;
}

function regulatorTable(p) {
  if (!p.regulators.length) return `<p class="muted small">No significant regulator.</p>`;
  const rows = p.regulators.map(r => { const c = p.genes[r.gene] || {};
    const alt = c.symbol && c.symbol !== r.gene ? ` <span class="muted">(${esc(c.symbol)})</span>` : "";
    const role = r.log2fc == null ? "" : r.log2fc < 0 ? "activator ↓" : "repressor ↑";
    return `<tr><td style="font-family:var(--mono)"${c.name ? ` data-tip="${esc(c.name)}"` : ""}><b>${esc(r.gene)}</b>${alt}</td>
      <td>${signed(r.log2fc)}</td><td><span class="status"><span class="dot" style="background:${r.log2fc < 0 ? "var(--div-neg)" : "var(--div-pos)"}"></span>${role}</span></td>
      <td>${esc(r.adj_p)}</td><td>${esc(r.condition)}</td></tr>`; }).join("");
  return `<table><tr><th>Regulator</th><th>log2FC</th><th>Sign</th><th>adj p</th><th>Condition</th></tr>${rows}</table>`;
}

// ---- driving genes ------------------------------------------------------------------------
const VERDICT = {supported: "var(--good)", mixed: "var(--warning)", contradicted: "var(--critical)"};
function verdictCell(v) { return `<span class="status"><span class="dot" style="background:${VERDICT[v] || "var(--muted)"}"></span>${esc(v)}</span>`; }
const pmidLink = id => `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(id)}/" target="_blank" rel="noopener">PMID ${esc(id)}</a>`;
function paperItem(x) {
  const title = x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title);
  const info = [x.year ? esc(x.year) : "", x.pmid ? pmidLink(x.pmid) : "",
                x.same ? `<span class="flag" style="color:var(--good)">same cell type</span>` : ""].filter(Boolean).join(" · ");
  return `<li><div>${title}</div>${x.text ? `<div class="small">${esc(x.text)}</div>` : ""}${info ? `<div class="small muted">${info}</div>` : ""}</li>`;
}
const paperList = arr => `<ul class="papers">${arr.map(paperItem).join("")}</ul>`;
function otherPapers(o, wrap) {
  const n = o.gene_function.length + o.literature.length;
  if (!n) return wrap ? "" : `<span class="muted small">No paper retrieved.</span>`;
  const body = (o.gene_function.length ? `<div class="psub">Gene function search</div>${paperList(o.gene_function)}` : "") +
               (o.literature.length ? `<div class="psub">Program literature search</div>${paperList(o.literature)}` : "");
  return wrap ? `<details class="more"><summary>Other literature searched (${n})</summary>${body}</details>` : body;
}
function driversCard(p) {
  const d = p.drivers;
  if (!d) return "";
  const hits = new Set(d.driving.map(g => g.gene));
  const rows = d.driving.map(g => `<tr><td>${chip(p, g.gene, true)}</td><td>${verdictCell(g.verdict)}</td>
      <td>${esc(g.why)}${g.cell_type ? `<div class="small muted" style="margin-top:4px">${esc(g.cell_type)}</div>` : ""}</td>
      <td style="min-width:320px">${g.supporting.length ? paperList(g.supporting) : `<span class="muted small">No supporting paper listed.</span>`}${otherPapers(g.other, true)}</td></tr>`).join("");
  return `<details class="card" open><summary>Driving genes (${d.driving.length}) — with support</summary>
    ${rows ? `<table><tr><th>Gene</th><th>Verdict</th><th>Why</th><th>Supporting papers</th></tr>${rows}</table>` : `<p class="muted">No gene's literature explains this label.</p>`}
    <p class="small muted">Genes whose own papers explain the label (paper-qa evidence${d.judge_model ? ", verdicts by " + esc(d.judge_model) : ""}), supported before mixed.</p></details>`;
}

// ---- TF motif enrichment ------------------------------------------------------------------
// sequence logo as inline SVG: information content (bits, max 2) or a CWM (positive up, negative down)
const LOGO_COLORS = {A: "#109648", C: "#255C99", G: "#F7B32B", T: "#D62839"};
function logoSvg(entry, width, height) {
  if (!entry) return "";
  const m = entry.matrix, n = m.length, col = width / Math.max(n, 1), cwm = entry.kind === "cwm";
  const pos = m.map(r => r.reduce((a, v) => a + Math.max(v, 0), 0)), neg = m.map(r => r.reduce((a, v) => a + Math.max(-v, 0), 0));
  const top = cwm ? Math.max(...pos, 1e-9) : 2, bottom = cwm ? Math.max(...neg, 0) : 0;
  const scale = height / (top + bottom), base = top * scale;
  let out = "";
  m.forEach((row, i) => {
    const letters = row.map((v, j) => ["ACGT"[j], v]);
    let up = base, down = base;
    letters.filter(l => l[1] > 0).sort((a, b) => a[1] - b[1]).forEach(([b, v]) => { const h = v * scale; if (h < 0.3) return;
      out += `<text transform="translate(${(i * col).toFixed(1)},${up.toFixed(1)}) scale(${(col / 7.2).toFixed(3)},${(h / 7.2).toFixed(3)})" textLength="7.2" lengthAdjust="spacingAndGlyphs" fill="${LOGO_COLORS[b]}">${b}</text>`; up -= h; });
    letters.filter(l => l[1] < 0).sort((a, b) => a[1] - b[1]).forEach(([b, v]) => { const h = -v * scale; if (h < 0.3) return; down += h;
      out += `<text transform="translate(${(i * col).toFixed(1)},${down.toFixed(1)}) scale(${(col / 7.2).toFixed(3)},${(h / 7.2).toFixed(3)})" textLength="7.2" lengthAdjust="spacingAndGlyphs" fill="${LOGO_COLORS[b]}">${b}</text>`; });
  });
  const label = cwm ? "contribution weight matrix (TF-MoDISco pattern)" : "information content (bits)";
  return `<svg class="logo" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" role="img"><title>${label}</title>${cwm && bottom ? `<line x1="0" x2="${width}" y1="${base}" y2="${base}" stroke="var(--border)" stroke-width="0.5"/>` : ""}${out}</svg>`;
}
function motifLogo(source, tf) {
  const entry = (META.motif_logos || {})[`${source}|${tf}`];
  return entry ? logoSvg(entry, Math.min(entry.matrix.length * 7, 150), 26) : "";
}
function candidateChip(c) {
  const support = c.tier === "motif+regulator" ? `knockdown log2FC ${signed(c.log2fc)}, adj p ${fmtP(c.adj_p)}`
    : (c.loading_rank ? `loading rank ${c.loading_rank}` : "");
  const tier = {"motif+regulator": "regulator", "motif+expressed_in_program": "in program", "motif+expressed": "expressed"}[c.tier] || c.tier;
  return `<span class="chip hit" data-tip="${esc(c.tier)} via ${esc(c.motif)}${support ? " · " + esc(support) : ""}"><i>${esc(c.tf)}</i> <span class="small">${tier}${support ? " · " + esc(support) : ""}</span></span>`;
}
function motifCard(p) {
  const m = p.motifs;
  if (!m) return "";
  const src = META.motif_source ? ` Source: ${esc(META.motif_source)}.` : "";
  if (!Object.values(m.n_tested).some(n => n)) return `<div class="card"><h3>TF motif enrichment</h3><p class="muted small">No motif enrichment results for this program.${src}</p></div>`;
  // one table per element type; one row per significant motif (strongest families first), the motif source
  // as a column, never pooled across methods; candidate TFs on the row of the motif they came via
  const sections = m.sections || [["promoter", "promoter", ""], ["enhancer", "enhancer", ""]];
  const test = META.motif_test || {method: "ttest", n_top: 300}, corr = test.method === "correlation";
  const multiMethod = sections.some(s => s[2]);
  const tables = ["promoter", "enhancer"].map(et => {
    const mine = sections.filter(s => s[1] === et);
    if (!mine.length) return "";
    const counts = mine.map(([key, , source]) => {
      const nf = m.n_families ? m.n_families[key] : m.families[key].length;
      return `${source ? esc(source) + ": " : ""}${m.n_significant[key]} of ${m.n_tested[key]} motifs significant${nf ? ` in ${nf} famil${nf > 1 ? "ies" : "y"}` : ""}${nf > m.families[key].length ? ` (top ${m.families[key].length} families shown)` : ""}`;
    }).join(" · ");
    const rows = mine.flatMap(([key, , source]) => {
      const raw = (m.section_sources || {})[key];
      return m.families[key].flatMap(f => {
        const shown = new Set(f.motifs.map(x => x[0]));
        return f.motifs.map(([tf, e, q], i) => {
          // candidates reached via this motif; a family's candidates via motifs not shown go on its first row
          const cands = f.candidates.filter(c => c.motif === tf || (i === 0 && !shown.has(c.motif)));
          const strong = cands.filter(c => c.tier !== "motif+expressed"), weak = cands.filter(c => c.tier === "motif+expressed");
          const family = String(tf).startsWith(f.family) ? "" : `<div class="muted small">${esc(f.family)}</div>`;
          return `<tr>${multiMethod ? `<td class="small">${esc(source || "")}</td>` : ""}
            <td><span style="font-family:var(--mono);white-space:nowrap">${esc(tf)}</span>${family}</td><td>${motifLogo(raw, tf)}</td>
            <td class="num">${corr ? "r=" + e.toFixed(2) : e.toFixed(2) + "×"}</td><td class="num">${q.toExponential(1)}</td>
            <td class="small">${strong.map(candidateChip).join(" ")}${weak.length ? `${strong.length ? "<br>" : ""}<span class="muted">expressed: ${weak.map(c => `<i>${esc(c.tf)}</i>`).join(", ")}</span>` : ""}</td></tr>`;
        });
      });
    }).join("");
    return `<h4 style="margin:10px 0 4px">${et === "promoter" ? "Promoters" : "Enhancers"} <span class="muted small">· ${counts}</span></h4>
      ${rows ? `<table class="motif-table"><tr>${multiMethod ? "<th>Method</th>" : ""}<th>Motif</th><th>Logo</th><th>${corr ? "Correlation" : "Enrichment"}</th><th>FDR</th><th>Candidate TFs</th></tr>${rows}</table>`
             : `<p class="muted small">No significant motif.</p>`}`;
  }).join("");
  return `<div class="card"><h3>TF motif enrichment</h3>${tables}
    <p class="small muted">Correlative: ${corr ? "a motif whose per-gene count correlates with the program loadings (FDR &lt; 0.05, r &gt; 0, over expressed genes)" : `a motif over-represented near the top ${test.n_top} genes (FDR &lt; 0.05, enrichment &gt; 1, vs expressed genes)`} nominates a TF family; it does not show that TF acts on the program. Method: FIMO scan of a motif database, or Fi-NeMo hits from ChromBPNet / TF-MoDISco; methods are tested separately. Family = MotifCompendium family (TFClass family for HOCOMOCO). Candidate TFs = expressed TFs on the motif's database TF list: regulator = the TF's knockdown also moves the program; in program = the TF is among the program genes; expressed = expressed only. Logos: information content (FIMO database motif) or the TF-MoDISco contribution weight matrix (Fi-NeMo).${src}</p></div>`;
}

// ---- interpretation (program_interpretation.py) -------------------------------------------
const STATUS = {
  primary_explanation: ["Primary", "var(--critical)"],
  contributing: ["Contributing", "var(--warning)"],
  ruled_out: ["Ruled out", "var(--good)"],
  cannot_assess: ["Cannot assess", "var(--muted)"],
};
function statusCell(s) { const [t, c] = STATUS[s] || [s, "var(--muted)"];
  return `<span class="status"><span class="dot" style="background:${c}"></span>${esc(t)}</span>`; }
const pretty = s => String(s || "").replace(/_/g, " ");
function slotCard(p, title, s) {
  if (!s || !s.claim) return `<div class="slot"><h4>${title}</h4><p class="muted">Not filled.</p></div>`;
  const regs = (s.support_regulators || []).filter(r => !(s.support_genes || []).includes(r));
  return `<div class="slot"><h4>${title}${s.confidence ? ` · <span class="muted">${esc(s.confidence)} confidence</span>` : ""}</h4>
    <p>${esc(s.claim)}</p>${(s.support_genes || []).length || regs.length ? `<div>${(s.support_genes || []).map(g => chip(p, g)).join("")}${regs.map(g => chip(p, g, true)).join("")}</div>` : ""}
    ${(s.support_terms || []).length ? `<p class="small muted" style="margin:4px 0 0">Terms: ${s.support_terms.map(esc).join("; ")}</p>` : ""}
    ${s.mechanism_kind ? `<p class="small muted" style="margin:4px 0 0">Mechanism kind: ${esc(s.mechanism_kind)}</p>` : ""}
    ${(s.pmids || []).length ? `<p class="small" style="margin:4px 0 0">${s.pmids.map(pmidLink).join(", ")}</p>` : ""}</div>`;
}
function interpretationCards(p) {
  const it = p.interpretation;
  if (!it) return "";
  const confRows = it.confounders.map(c => `<tr><td>${esc(pretty(c.confounder))}</td><td>${statusCell(c.status)}</td><td>${esc(c.evidence)}</td></tr>`).join("");
  const modules = it.modules.map((m, i) => `<div class="card" style="margin:8px 0;background:var(--surface-soft)">
      <b>${i + 1}. ${esc(m.name)}</b> <span class="muted small">· ${esc(m.strength)}</span>
      <div style="margin:4px 0">${m.genes.map(g => chip(p, g)).join("")}</div><div class="small">${esc(m.mechanism)}</div></div>`).join("");
  const note = `<p class="small muted" style="margin:8px 0 0">Interpretation of the current label by ${esc(it.model)} from this program's evidence (genes, regulators, GO terms, pre-annotation screens, driving genes, motifs, retrieved papers); genes, regulators and PMIDs outside that evidence were removed.</p>`;
  return `<div class="card"><h3>Confounder rule-outs</h3><table><tr><th>Confounder</th><th>Status</th><th>Deciding evidence</th></tr>${confRows}</table></div>
    <div class="card"><h3>Layered interpretation <span class="muted small" style="font-weight:400">· coherence: ${esc(it.coherence)}</span></h3><div class="grid3">
      ${slotCard(p, "Upstream trigger", it.interpretation.upstream_trigger)}${slotCard(p, "Co-regulation mechanism", it.interpretation.coregulation_mechanism)}${slotCard(p, "Cellular output", it.interpretation.cellular_output)}</div>
      <p class="small muted" style="margin:8px 0 0">Outlined chips = knockdown regulators; plain chips = program genes.</p></div>
    <details class="card"><summary>Modules (${it.modules.length})</summary>
      <p class="small muted">A module is a subset of this program's genes grouped under a narrower process or mechanism than the label. Strength says how well the genes and terms back it: supported, suggestive or speculative.</p>${modules || '<p class="muted">None.</p>'}${note}</details>`;
}

// ---- pre-annotation screen ----------------------------------------------------------------
function screenCard(p) {
  const s = p.screen;
  if (!s) return "";
  const dot = (t, c) => `<span class="status"><span class="dot" style="background:${c}"></span>${t}</span>`;
  const fam = s.families.map(f => `<tr><td>Family: <b>${esc(f.name)}</b></td><td>${f.primary ? dot("Primary", "var(--warning)") : dot("Called", "var(--serious)")}</td>
      <td>${f.n_overlap} of ${s.n_top} top genes (expected ${f.expected}), p = ${esc(f.p_value)}<div style="margin-top:4px">${chips(p, f.genes)}</div></td></tr>`).join("")
    || `<tr><td>Family label</td><td>${dot("None", "var(--good)")}</td><td>No family or marker set has ≥ ${s.min_genes} of the top ${s.n_top} genes at p ≤ ${s.max_p}.</td></tr>`;
  const c = s.chrom;
  let chrom;
  if (c && c.p < 0.05) chrom = `<tr><td>Chromosome: <b>${esc(c.top_chromosome)}</b></td><td>${c.flag ? dot("Flagged", "var(--critical)") : dot("Enriched", "var(--warning)")}</td>
      <td>${c.genes_on_top_chromosome} of ${c.n_genes_located} located top genes (expected ${c.expected_on_top_chromosome}, fold ${c.fold_enrichment}), binomial p = ${esc(c.binomial_p)}<div style="margin-top:4px">${chips(p, c.top_chromosome_genes)}</div></td></tr>`;
  else chrom = `<tr><td>Chromosome enrichment</td><td>${dot(c ? "None" : "Cannot assess", c ? "var(--good)" : "var(--muted)")}</td>
      <td>No chromosome enriched at p &lt; 0.05${c ? ` (most genes on ${esc(c.top_chromosome)}: ${c.genes_on_top_chromosome} vs ${c.expected_on_top_chromosome} expected, p = ${esc(c.binomial_p)})` : ""}.</td></tr>`;
  return `<div class="card"><h3>Pre-annotation screen</h3><table><tr><th>Screen</th><th>Status</th><th>Evidence</th></tr>${fam}${chrom}</table>
    ${s.all_genes.length ? `<details class="more"><summary>All ${s.all_genes.length} screened genes</summary><div>${chips(p, s.all_genes)}</div></details>` : ""}
    <p class="small muted">Gene families and marker sets enriched among the top ${s.n_top} genes, against this run's gene universe; chromosome holding more top genes than expected (binomial test).</p></div>`;
}

// ---- page ---------------------------------------------------------------------------------
function render(id, keepScroll) {
  const p = PROGRAMS[id]; if (!p) return;
  if (id !== currentId) gridShowAll = false;
  currentId = id;
  document.querySelectorAll(".rail a").forEach(a => a.classList.toggle("active", +a.dataset.id === id));
  const active = document.querySelector(".rail a.active"); if (active) active.scrollIntoView({block: "nearest"});
  history.replaceState(null, "", "#program-" + id);
  if (!keepScroll) window.scrollTo(0, 0);
  const wasOpen = keepScroll ? [...document.querySelectorAll("#main details")].map(x => x.open) : null;
  const d = p.drivers, hits = new Set(d ? d.driving.map(g => g.gene) : []);
  const supported = d ? d.driving.length : 0, searched = d ? d.n_searched : 0;
  const topN = META.membership_top ? `top ${META.membership_top} ` : "";
  const soft = `style="background:var(--surface-soft);color:var(--text-soft)"`;
  document.getElementById("main").innerHTML = `
    <span class="pill">Program ${id}</span> ${DAYS.map(c => `<span class="pill" ${soft}>${esc(c)}</span>`).join(" ")}
    ${d ? `<span class="pill" ${soft} title="Driving genes / genes searched">${supported}/${searched} driver genes supported</span>` : ""}
    <h1>${esc(p.label)}</h1>
    <p class="sub">${esc(p.group)}${p.tag ? " · " + esc(p.tag) : ""}</p>
    <p class="lead">${esc(p.sentence)}</p>
    ${activityCard(p)}
    <div class="card"><h3>Genes</h3>
      <p class="small muted" style="margin:0 0 4px">Top ${p.top_genes.length} by program loading${d ? " (outlined = driving gene)" : ""}</p><div>${chips(p, p.top_genes, hits)}</div>
      <p class="small muted" style="margin:10px 0 4px">Top unique genes: high in this program, low in others${META.membership_top ? ` among ${topN}loaded genes` : ""}</p><div>${chips(p, p.distinctive, hits)}</div>
      <p class="small muted" style="margin:6px 0 0">The annotator saw these same genes. Click a gene for its NCBI Gene page.</p></div>
    <div class="card"><h3>Top GO terms</h3><p class="small muted" style="margin:0 0 4px">Gene ontology enrichment of ${topN}program genes</p>
      ${p.go.length ? `<ol class="go">${p.go.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : `<p class="muted">No enriched GO term.</p>`}</div>
    <div class="card"><h3>${DAYS.length > 1 ? "Regulators by condition" : "Significant regulators"}</h3>
      ${p.volcano.length ? `${volcanoes(p)}
      <details style="margin-top:8px"><summary class="small" style="cursor:pointer">Table view — ${DAYS.length > 1 ? "log2FC of every significant regulator in every condition" : "significant regulators"}</summary>${regulatorGrid(p)}</details>` : ""}
      <details style="margin-top:8px"><summary class="small" style="cursor:pointer">List view — top regulators given to the annotator</summary>
      <p class="small muted" style="margin:4px 0">Program usage log2FC on CRISPRi knockdown; best adj p over conditions</p>${regulatorTable(p)}</details></div>
    ${driversCard(p)}
    ${motifCard(p)}
    ${interpretationCards(p)}
    ${screenCard(p)}
    <p class="small muted">Built ${esc(META.built)} · name and summary by ${esc(p.label_model)}${d ? ` · driving genes: paper-qa evidence, verdicts by ${esc(d.judge_model)}` : ""} · source ${esc(p.source)}</p>`;
  if (wasOpen) document.querySelectorAll("#main details").forEach((x, i) => { if (i < wasOpen.length) x.open = wasOpen[i]; });
}

function prev() { const i = IDS.indexOf(currentId); if (i > 0) render(IDS[i-1]); }
function next() { const i = IDS.indexOf(currentId); if (i < IDS.length-1) render(IDS[i+1]); }
document.addEventListener("keydown", e => { if (/input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") prev(); if (e.key === "ArrowRight") next(); });

// hover tooltips for chart marks and genes
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 330) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

function applyTheme(t) { document.documentElement.dataset.theme = t; document.getElementById("themeBtn").textContent = t === "dark" ? "Light" : "Dark"; }
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("program-viewer-theme", t); } catch (e) {} applyTheme(t); if (currentId !== null) render(currentId, true); }
let savedTheme = null; try { savedTheme = localStorage.getItem("program-viewer-theme"); } catch (e) {}
applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

buildRail();
function idFromHash() { return parseInt((location.hash.match(/program-(\d+)/) || [])[1]); }
window.addEventListener("hashchange", () => { const id = idFromHash(); if (IDS.includes(id) && id !== currentId) render(id); });
render(IDS.includes(idFromHash()) ? idFromHash() : IDS[0]);
