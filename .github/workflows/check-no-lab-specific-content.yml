name: check-no-lab-specific-content

# This repo is public: fail if any tracked file contains study/dataset names,
# collaborator names, personal emails, or lab/cluster-specific paths.
# Pattern list: tools/check_no_lab_specific_content.py; exceptions: tools/lab_specific_allowlist.txt

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files
        run: python3 tools/check_no_lab_specific_content.py
