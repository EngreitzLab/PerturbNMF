[project]
name = "perturbnmf"
version = "0.1.1"
description = "PerturbNMF pipeline for single-cell perturbation data"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/Script"]
pythonpath = ["src"]

[tool.ruff]
# `ruff format` (default black-compatible style, line length 88) covers .py files only;
# notebooks and Markdown code blocks are left alone. Formatted with ruff 0.17.3.
extend-exclude = ["*.ipynb", "*.md"]
